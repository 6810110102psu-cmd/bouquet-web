<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Bouquet Web</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/flowers.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;500;600&display=swap" rel="stylesheet">

<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark px-4">
    <a class="navbar-brand" href="/">Bouquet</a>

    <div class="ms-auto d-flex gap-2">
        {% if session.get("user_id") %}
            <!-- Login แล้ว -->
            <a href="/flowers" class="btn btn-outline-light">Flowers</a>
            <a href="/create-bouquet" class="btn btn-outline-light">Create Bouquet</a>
            <a href="/history" class="btn btn-outline-light">History</a>
            <a href="/logout" class="btn btn-outline-light">Logout</a>
        {% else %}
            <!-- Guest -->
            <a href="/flowers" class="btn btn-outline-light">Flowers</a>
            <a href="/login" class="btn btn-outline-light">Login</a>
        {% endif %}
    </div>
</nav>

<div class="container mt-4">
    {% block content %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
