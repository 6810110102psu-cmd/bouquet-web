<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Bouquet Web</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark px-3">
    <a class="navbar-brand" href="/">Bouquet</a>

    <div class="ms-auto">
        {% if session.get("username") %}
            <span class="text-white me-2">
                {{ session.username }}
            </span>

            <a href="/flowers" class="btn btn-outline-light btn-sm me-2">
                Flowers
            </a>

            <a href="/my-bouquet" class="btn btn-outline-light btn-sm me-2">
                My Bouquet
                {% if session.get("bouquet") %}
                    <span class="badge bg-danger ms-1">
                        {{ session["bouquet"]|length }}
                    </span>
                {% endif %}
            </a>

            <a href="/history" class="btn btn-outline-light btn-sm me-2">
                History
            </a>

            <a href="/logout" class="btn btn-light btn-sm">
                Logout
            </a>

        {% else %}
            <a href="/login" class="btn btn-outline-light btn-sm me-2">
                Login
            </a>
            <a href="/register" class="btn btn-outline-light btn-sm me-2">
                Register
            </a>
            <a href="/flowers" class="btn btn-outline-light btn-sm me-2">
                Flowers
            </a>
            <a href="/recommended" class="btn btn-outline-light btn-sm">
                Recommended
            </a>
        {% endif %}
    </div>
</nav>

<div class="container mt-4">
    {% block content %}{% endblock %}
</div>

</body>
</html>
