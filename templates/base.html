<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Bouquet Web</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark px-3">
    <a class="navbar-brand" href="/">Bouquet</a>

    <div>
    {% if session.get("username") %}
        <span class="text-white me-2">{{ session.username }}</span>
        <a href="/logout" class="btn btn-light btn-sm">Logout</a>
    {% else %}
        <a href="/login" class="btn btn-light btn-sm">Login</a>
        <a href="/register" class="btn btn-outline-light btn-sm">Register</a>
        <a href="/flowers" class="btn btn-outline-light btn-sm">Flowers</a>
        <a href="/preview" class="btn btn-outline-light btn-sm me-2">
        My Bouquet
    {% if session.get("bouquet") %}
        <span class="badge bg-danger ms-1">
            {{ session["bouquet"]|length }}
        </span>
        <a href="/history" class="btn btn-outline-light btn-sm ms-2">
            History
    {% endif %}
</a>
        {% endif %}
    </div>
</nav>

<div class="container mt-4">
    {% block content %}{% endblock %}
</div>

</body>
</html>
