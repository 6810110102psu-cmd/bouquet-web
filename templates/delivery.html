{% extends "base.html" %}
{% block content %}

<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow p-4 border-0" style="border-radius: 20px;">
            <h2 class="text-center mb-4">ข้อมูลการจัดส่ง</h2>
            
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label fw-bold">ชื่อ-สกุล ผู้รับ</label>
                    <input type="text" name="fullname" class="form-control" placeholder="ระบุชื่อผู้รับ" required>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">เบอร์โทรศัพท์</label>
                    <input type="tel" name="phone" class="form-control" placeholder="08x-xxx-xxxx" required>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold d-block">วิธีรับสินค้า</label>
                    <div class="form-check form-check-inline">
                        <input class="form-check-item" type="radio" name="method" id="pickup" value="รับหน้าร้าน" required>
                        <label class="form-check-label" for="pickup">รับหน้าร้าน</label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-item" type="radio" name="method" id="delivery" value="จัดส่ง" required>
                        <label class="form-check-label" for="delivery">จัดส่งตามที่อยู่</label>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold">วันที่รับสินค้า</label>
                        <input type="date" name="receive_date" class="form-control" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold">เวลารับสินค้า</label>
                        <input type="time" name="receive_time" class="form-control" required>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-bold">ที่อยู่จัดส่ง / รายละเอียดเพิ่มเติม</label>
                    <textarea name="detail" class="form-control" rows="3" placeholder="ระบุเลขที่บ้าน ถนน หรือจุดสังเกต"></textarea>
                    <div class="form-text text-muted mt-2">
                        <i class="bi bi-geo-alt"></i> สำหรับการปักหมุดในแผนที่ (Google Maps) คุณสามารถคัดลอกลิงก์จาก App มาวางในช่องนี้ได้เลยครับ
                    </div>
                </div>

                <div class="text-center">
                    <button type="submit" class="btn btn-danger btn-lg w-100 py-2 fw-bold" style="border-radius: 10px;">
                        ถัดไป
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

{% endblock %}
