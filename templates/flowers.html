{% extends "base.html" %}

{% block content %}

<style>
/* ===== Animation ตอนโหลด ===== */
@keyframes fadeUp {
    from {
        opacity: 0;
        transform: translateY(20px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* การ์ด */
.card {
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 8px 20px rgba(0,0,0,0.08);
    transition: 0.25s ease;
    height: 100%;

    /* animation */
    animation: fadeUp 0.6s ease forwards;
    opacity: 0;
}

/* hover การ์ด */
.card:hover {
    transform: translateY(-4px);
    box-shadow: 0 14px 28px rgba(0,0,0,0.12);
}

/* กล่องรูป */
.flower-box {
    width: 100%;
    height: 220px;
    background-color: #f6f1e7;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
}

/* รูปดอกไม้ */
.flower-img {
    max-width: 85%;
    max-height: 85%;
    object-fit: contain;
    transition: transform 0.3s ease;
}

/* hover ขยายรูป */
.card:hover .flower-img {
    transform: scale(1.08);
}

/* เนื้อหาด้านล่าง */
.card-body {
    text-align: center;
    padding: 14px;
}

/* ชื่อดอกไม้ */
.card-body h5 {
    font-weight: 600;
    margin-bottom: 10px;
}
</style>

<h2 class="mb-4"> เลือกดอกไม้</h2>

<div class="row">
    {% for flower in flowers %}
        <div class="card shadow-sm border-0">
    <!-- กล่องรูป -->
    <div class="flower-box">
        <img src="{{ url_for('static', filename=flower.image) }}"
            class="flower-img">
    </div>

        <div class="card-body">
            <h5>{{ flower.name }}</h5>
            <a href="/add_to_bouquet/{{ flower.id }}"
                class="btn btn-danger btn-sm">
                Add to bouquet
            </a>
        </div>
    </div>
</div>
    {% endfor %}
</div>
{% endblock %}
