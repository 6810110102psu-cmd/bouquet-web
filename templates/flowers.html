{% extends "base.html" %}

{% block content %}

<style>
/* การ์ด */
.card {
    border-radius: 18px;       /* โค้งมน */
    overflow: hidden;          /* ให้พื้นหลังไม่ล้น */
    box-shadow: 0 8px 20px rgba(0,0,0,0.08); /* เงานุ่ม */
    transition: 0.25s ease;
}
.card:hover {
    transform: translateY(-4px);
    box-shadow: 0 14px 28px rgba(0,0,0,0.12);
}
/* กล่องรูปดอกไม้ */
.flower-box {
    height: 240px;             /* เพิ่มจาก 220 → 240 */
    background-color: #000000; /* สีดำ */
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 12px;
}

/* รูปดอกไม้ */
.flower-img {
    max-height: 100%;
    max-width: 100%;
    object-fit: contain;           /* สำคัญมาก */
}
/* ตัวอักษรชื่อ */
.card-body h5 {
    font-weight: 600;
}
</style>

<h2 class="mb-4"> เลือกดอกไม้</h2>

<div class="row">
    {% for flower in flowers %}
        <div class="card shadow-sm border-0">
    <!-- กล่องรูป -->
    <div class="flower-box">
        <img src="{{ url_for('static', filename=flower.image) }}"
            class="flower-img">
    </div>

    <div class="card-body text-center">
        <h5>{{ flower.name }}</h5>

        <a href="/add_to_bouquet/{{ flower.id }}"
        class="btn btn-danger btn-sm mt-2">
            Add to bouquet
        </a>
    </div>
</div>
    {% endfor %}
</div>
{% endblock %}
