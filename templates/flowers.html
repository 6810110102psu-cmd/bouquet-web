{% extends "base.html" %}

{% block content %}

<style>
/* กล่องรูปดอกไม้ */
.flower-box {
    height: 260px;
    background-color: #000000; /* สีดำ*/
    display: flex;
    align-items: center;
    justify-content: center;
}

/* รูปดอกไม้ */
.flower-img {
    max-height: 90%;
    max-width: 90%;
}
</style>

<h2 class="mb-4"> เลือกดอกไม้</h2>

<div class="row">
    {% for flower in flowers %}
        <div class="card shadow-sm border-0">
    <!-- กล่องรูป -->
    <div class="flower-box">
        <img src="{{ url_for('static', filename=flower.image) }}"
            class="flower-img">
    </div>

    <div class="card-body text-center">
        <h5>{{ flower.name }}</h5>

        <a href="/add_to_bouquet/{{ flower.id }}"
        class="btn btn-danger btn-sm mt-2">
            Add to bouquet
        </a>
    </div>
</div>
    {% endfor %}
</div>
{% endblock %}
