<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-4">
            <div class="card p-4 shadow">
                <h3 class="text-center mb-3">เข้าสู่ระบบ</h3>

                {% with messages = get_flashed_messages(with_categories=true) %}
                    {% if messages %}
                        {% for category, message in messages %}
                            <div class="alert alert-{{ category }}">{{ message }}</div>
                        {% endfor %}
                    {% endif %}
                {% endwith %}

                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">Username</label>
                        <input type="text" name="username" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" name="password" class="form-control" required>
                    </div>

                    <button type="submit" class="btn btn-dark w-100 mb-3">
                        Login
                    </button>
                </form>

                <div class="text-center">
                    <hr>
                    <p class="mb-0 text-muted">ยังไม่มีบัญชีใช่ไหม?</p>
                    <a href="/register" class="btn btn-outline-primary btn-sm mt-2 w-100">
                        สมัครสมาชิกใหม่ที่นี่
                    </a>
                    <br>
                    <a href="/" class="d-block mt-3 text-secondary text-decoration-none small">
                        กลับหน้าแรก
                    </a>
                </div>

            </div>
        </div>
    </div>
</div>

</body>
</html>
