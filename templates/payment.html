{% extends "base.html" %}
{% block content %}
<div class="text-center mt-5">
    <div class="card shadow p-5 d-inline-block" style="max-width: 500px;">
        <h2 class="mb-4 text-primary">ชำระเงิน (จำลอง)</h2>
        
        <div class="alert alert-info">
            กรุณาสแกน QR Code หรือโอนเงินตามยอดที่สรุปไว้
        </div>

        <img src="{{ url_for('static', filename='images/payment.jpg') }}" 
            class="img-fluid rounded mb-4" style="max-height: 400px;" alt="Payment QR Code">

        <form method="POST">
            <button type="submit" class="btn btn-success btn-lg w-100">
                ชำระเงินเรียบร้อย (ตกลง)
            </button>
        </form>
        
        <p class="mt-3 text-muted">เมื่อกดปุ่ม ระบบจะบันทึกประวัติการสั่งซื้อของคุณ</p>
    </div>
</div>
{% endblock %}
