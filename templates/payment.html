{% extends "base.html" %}
{% block content %}
<div class="container mt-4 mb-5">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-6">
            <div class="card shadow-sm border-0 p-4 p-md-5 text-center" style="border-radius: 30px;">
                <h2 class="fw-bold mb-3" style="color: #4a4a4a;">ชำระเงิน</h2>
                <p class="text-muted small mb-4">กรุณาสแกน QR Code เพื่อโอนเงินตามยอดชำระด้านล่าง</p>

                <div class="py-3 px-4 rounded-4 mb-4" style="background-color: #fff9f9; border: 2px dashed #ffc1c1;">
                    <span class="text-muted d-block small mb-1">ยอดชำระสุทธิ</span>
                    <h2 class="text-danger fw-bold mb-0">{{ "{:,.2f}".format(total) }} บาท</h2>
                </div>

                <div class="mb-4">
                    <img src="{{ url_for('static', filename='images/payment.jpg') }}" 
                        alt="QR Code Payment" 
                        class="img-fluid border p-3 bg-white shadow-sm" 
                        style="border-radius: 20px; max-width: 250px;">
                    
                    <div class="mt-3">
                        <p class="mb-0 fw-bold text-dark">ธนาคารกสิกรไทย (จำลอง)</p>
                        <p class="text-muted small">ชื่อบัญชี: ร้าน Bouquet Web (Nuttarinee)</p>
                    </div>
                </div>

                <form action="/payment" method="POST" enctype="multipart/form-data">
                    <div class="mb-4 text-start">
                        <label class="form-label small fw-bold text-secondary">
                            <i class="bi bi-image me-1"></i> แนบหลักฐานการโอนเงิน (จำลอง)
                        </label>
                        <input type="file" class="form-control rounded-pill shadow-none border-2" accept="image/*">
                    </div>

                    <button type="submit" class="btn btn-danger btn-lg rounded-pill px-5 py-3 fw-bold w-100 shadow-sm">
                        <i class="bi bi-check-circle-fill me-2"></i> ยืนยันการชำระเงิน
                    </button>
                    
                    <a href="/summary" class="btn btn-link text-muted mt-3 text-decoration-none small">
                        <i class="bi bi-arrow-left me-1"></i> ย้อนกลับไปตรวจสอบรายการ
                    </a>
                </form>
            </div>
        </div>
    </div>
</div>

<style>
    .rounded-4 { border-radius: 1.25rem !important; }
    .form-control:focus {
        border-color: #ff5e78;
        background-color: #fff9f9;
    }
</style>
{% endblock %}
