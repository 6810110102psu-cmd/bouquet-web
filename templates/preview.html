{% extends "base.html" %}
{% block title %}Preview Bouquet{% endblock %}

{% block content %}
<h2>ช่อดอกไม้ของคุณ</h2>

{% if flowers %}
<div class="row">
    {% for flower in flowers %}
    <div class="col-md-3 mb-3">
    <img src="{{ url_for('static', filename=flower.image) }}"
        class="img-fluid rounded">
    <p class="text-center">{{ flower.name }}</p>
    <div class="text-center mt-4">
    <a href="/blessing" class="btn btn-pink btn-lg">
        รับคำอวยพร
    <a href="/remove/{{ flower.id }}"
    class="btn btn-outline-danger btn-sm mt-2">
    ลบ
    <div class="text-center mt-4">
    <a href="/save_bouquet" class="btn btn-success btn-lg">
        บันทึกและไปต่อ 
    </a>
</div>
    </div>
    {% endfor %}
</div>
{% else %}
<p>ยังไม่ได้เลือกดอกไม้</p>
{% endif %}

<a href="/flowers" class="btn btn-secondary">เพิ่มดอกไม้</a>
{% endblock %}
