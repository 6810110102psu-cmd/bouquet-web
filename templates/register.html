<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Register - สมัครสมาชิก</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-4">
            <div class="card p-4 shadow">
                <h3 class="text-center mb-3">สมัครสมาชิกใหม่</h3>

                {% with messages = get_flashed_messages(with_categories=true) %}
                    {% if messages %}
                        {% for category, message in messages %}
                            <div class="alert alert-{{ category }}">{{ message }}</div>
                        {% endfor %}
                    {% endif %}
                {% endwith %}

                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">Username (อย่างน้อย 8 ตัวอักษร)</label>
                        <input type="text" name="username" class="form-control" minlength="8" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Password (อย่างน้อย 8 ตัวอักษร)</label>
                        <input type="password" name="password" class="form-control" minlength="8" required>
                    </div>
                    
                    <button type="submit" class="btn btn-primary w-100 mb-3">
                        สมัครสมาชิก
                    </button>
                </form>

                <div class="text-center">
                    <hr>
                    <a href="/login" class="text-decoration-none small">มีบัญชีอยู่แล้ว? เข้าสู่ระบบที่นี่</a>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
